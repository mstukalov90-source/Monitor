# MONITOR — nginx на 172.21.198.219
# WebCRM SPA + API (:8080) и M2M MONITOR API (:8000) на одном :80
# Этап 4: снаружи (не corp) — только M2M paths; SPA/WebCRM — только LAN
# См. ../MIGRATION.md, ../STAGE4_REPORT.md

# geo должен быть в http{} (conf.d подключается из http)
geo $is_internal {
    default 0;
    127.0.0.0/8 1;
    172.21.0.0/16 1;
}

server {
    listen 80;
    server_name 172.21.198.219 monitor-crm.mggt.ru;

    root /var/www/monitor-webcrm;
    index index.html;

    # --- M2M MONITOR (monitor-api :8000) — без geo (шлюз + corp) ---
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/photos/meta/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/uuids/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mggtfield/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_request_buffering off;
    }

    location /api/qgis/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- WebCRM API — только внутренняя сеть ---
    location /api/ {
        if ($is_internal = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # --- SPA — только внутренняя сеть ---
    location / {
        if ($is_internal = 0) {
            return 403;
        }
        try_files $uri $uri/ /index.html;
    }
}
