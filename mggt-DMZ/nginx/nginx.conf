# MONITOR DMZ — nginx reverse proxy
# Сервер А: 172.21.198.222 → Сервер Б: 172.21.198.219
# Ubuntu 22.04, без Docker, без хранения данных

# RED OS / RHEL: load stream module (dnf install nginx-mod-stream)
include /usr/share/nginx/modules/*.conf;

# RED OS / RHEL: nginx; Ubuntu: www-data
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

# TCP proxy: PostgreSQL для Android
stream {
    log_format stream_basic '$remote_addr [$time_local] '
                            '$protocol $status $bytes_sent $bytes_received '
                            '$session_time "$upstream_addr"';

    access_log /var/log/nginx/postgres_stream.log stream_basic;

    upstream postgres_backend {
        server 172.21.198.219:5432;
    }

    server {
        listen 5432;
        proxy_pass postgres_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Field photo uploads: API limit 20 MiB + margin
    client_max_body_size 25m;

    access_log /var/log/nginx/monitor_api_access.log;
    error_log  /var/log/nginx/monitor_api_error.log;

    upstream monitor_api {
        server 172.21.198.219:8000;
    }

    server {
        listen 8000;
        server_name _;

        location / {
            proxy_pass http://monitor_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream uploads through proxy without writing to DMZ disk
            proxy_request_buffering off;
            proxy_buffering off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
